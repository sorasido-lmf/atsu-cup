<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>あつ杯</title>
<link rel="icon" type="image/png" href="assets/icons/headings/page-home-v1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
<link rel="stylesheet" href="guide-assistant.css">
</head>
<body class="page-home page-scene page-exterior">
<div class="wrap">
  <header class="top">
    <div class="crown-mark"><img class="page-heading-icon" src="assets/icons/headings/page-home-v1.png" alt="" width="64" height="64"></div>
    <h1>あつ杯</h1>
    <div class="sub">LINE monster farm・tournament</div>
  </header>

  <section class="panel">
    <h2>開催中の大会</h2>
    <div id="currentTournamentBox"></div>
  </section>

  <section class="panel">
    <h2>このツールでできること</h2>
    <div class="menu-grid">
      <a class="menu-card" href="tournaments.html"><img class="menu-page-icon" src="assets/icons/headings/page-tournaments-v1.png" alt="" width="48" height="48">大会一覧</a>
      <a class="menu-card" href="record.html"><img class="menu-page-icon" src="assets/icons/headings/page-records-v1.png" alt="" width="48" height="48">戦績</a>
      <a class="menu-card" href="users.html"><img class="menu-page-icon" src="assets/icons/headings/page-users-v1.png" alt="" width="48" height="48">ユーザー管理</a>
      <a class="menu-card" href="settings.html"><img class="menu-page-icon" src="assets/icons/headings/page-settings-v1.png" alt="" width="48" height="48">設定</a>
    </div>
  </section>

</div>

<script src="tap-ripple.js"></script>
<script src="gas-config.js"></script>
<script src="google-auth.js"></script>
<script src="gas-db.js"></script>
<script src="atsucup-data.js"></script>
<script src="atsucup-core.js"></script>
<script src="guide-assistant.js"></script>
<script>
(function(){
  "use strict";
  const state = AtsuCup.state;
  const escapeHtml = AtsuCup.escapeHtml;
  AtsuCup.restore();

  const currentTournamentBox = document.getElementById("currentTournamentBox");

  function renderCurrentTournamentBox(){
    // 練習用(ゲスト)の進行中大会を先に、認証済みの進行中大会を続けて表示する
    // (ログイン中はゲストプールが常に空になる不変条件があるため、ログイン状態を個別に見る必要はない)
    const guestOngoing = state.guestTournaments.filter(t=>t.status==='ongoing');
    const ongoing = state.tournaments.filter(t=>t.status==='ongoing');
    if(!guestOngoing.length && !ongoing.length){
      currentTournamentBox.innerHTML = `<div class="empty-state"><span class="big">🏆</span>開催中の大会はありません。</div>
        <a class="btn btn-primary" style="width:100%; margin-top:12px;" href="tournament-create.html">➕ 大会を作成する</a>`;
      return;
    }
    // 開催中の大会を全件表示(複数同時進行に対応)
    // 並び順は 公式大会→制限杯→進行中/完了→ローカル で固定
    const cardOf = (t, guest)=>{
      const officialTag = t.isOfficial ? '<span class="flag-badge official">🏅 公式大会</span> ' : '';
      const restrictedTag = t.isRestricted ? '<span class="flag-badge restricted">🔒 制限杯</span> ' : '';
      const badge = t.winnerName ? `<span class="status-badge done">優勝者決定</span>` : `<span class="status-badge open">進行中</span>`;
      return `<a class="ongoing-card" href="tournament-detail.html?id=${encodeURIComponent(t.id)}">
        ${officialTag}${restrictedTag}${badge}${guest?' <span class="status-badge open" style="background:none; border:1px solid var(--line);">ローカル</span>':''}
        <div class="cur-title" style="margin-top:6px;">${escapeHtml(t.title)}</div>
        ${t.winnerName?`<div class="cur-line champ">👑 ${escapeHtml(t.winnerName)}</div>`:''}
      </a>`;
    };
    const cards = guestOngoing.map(t=>cardOf(t,true)).join('') + ongoing.map(t=>cardOf(t,false)).join('');
    currentTournamentBox.innerHTML = cards + `<a class="btn btn-primary" style="width:100%; margin-top:10px;" href="tournament-create.html">➕ 新しい大会を作成する</a>`;
  }

  renderCurrentTournamentBox();
  // data/*.json(GitHub側=正)の取り込みが終わったら描き直す
  AtsuCup.ready.then(()=>{ renderCurrentTournamentBox(); });
  // ログイン状態が変わったら(このタブ内で)描き直す
  if(typeof GoogleAuth !== 'undefined') GoogleAuth.onStateChange(()=> renderCurrentTournamentBox());
})();
</script>
</body>
</html>
