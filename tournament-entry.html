<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>あつ杯 大会エントリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
<style>
  .flow-banner{
    background:linear-gradient(180deg,rgba(255,145,69,.18),rgba(255,106,43,.06)); border:1px solid var(--ember2);
    border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:var(--cream); line-height:1.8;
  }
  .selected-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .available-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .roster-cell{
    display:flex; align-items:center; gap:6px; min-width:0; background:#0d0a14; border:1.5px solid var(--line);
    border-radius:10px; padding:9px 8px; cursor:pointer;
  }
  .roster-cell.selected{ border-color:var(--ember2); background:linear-gradient(180deg,rgba(255,145,69,.14),rgba(255,106,43,.05)); flex-direction:column; align-items:stretch; gap:6px; }
  .roster-cell .nm{flex:1; min-width:0; font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .roster-cell .cell-actions{ display:flex; align-items:center; gap:6px; }
  .roster-cell .rm{
    flex-shrink:0; background:none; border:1px solid var(--line); border-radius:6px; color:#6b5f82; font-size:11px;
    cursor:pointer; padding:3px 6px; line-height:1;
  }
  .roster-cell .cam-toggle-inline{ flex-shrink:0; padding:2px 6px; font-size:11px; }
  .next-flow-box{ margin-top:20px; }
  .lock-notice{
    background:#241214; border:1px solid #5a2222; border-radius:14px; padding:12px 14px;
    margin-bottom:16px; font-size:12.5px; color:#ffb3b3; line-height:1.8;
  }
</style>
</head>
<body>
<a class="back-link" id="backLink" href="index.html">‹ 戻る</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark">🙋</div>
    <h1>大会エントリー</h1>
    <div class="sub" id="entryTournamentName">TOURNAMENT ENTRY</div>
  </header>

  <div id="flowBanner"></div>
  <div id="blockedBox" style="display:none;"></div>
  <div id="lockNotice" style="display:none;"></div>

  <div id="entryPanels">
  <section class="panel">
    <h2><span class="num">01</span> 今回参加する人</h2>
    <div id="countBadges"></div>
    <div id="selectedList" style="margin-top:12px;"></div>
  </section>

  <section class="panel">
    <h2><span class="num">02</span> 登録済みユーザーから追加</h2>
    <p class="hint">タップで今回の大会に追加します。まだ登録されていない人は「新規ユーザー登録」から追加できます。</p>
    <div id="availableList"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-ghost" id="openRegisterBtn">➕ 新規ユーザー登録</button>
      <a class="btn btn-ghost" href="users.html">🧑‍🤝‍🧑 ユーザー管理を開く</a>
    </div>
    <div id="syncStatus" style="margin-top:10px;"></div>
  </section>

  <div class="next-flow-box" id="nextFlowBox">
    <a class="btn btn-gold" style="width:100%;" id="toDetailLink" href="tournament-detail.html">‹ 大会詳細に戻る</a>
    <div id="exitStatus" style="margin-top:8px;"></div>
  </div>
  </div>

  <footer class="note">参加者・大会・対戦結果・戦績は、すべてこの端末のブラウザ内に保存されます。</footer>
</div>

<script src="tap-ripple.js"></script>
<script src="gas-config.js"></script>
<script src="google-auth.js"></script>
<script src="gas-db.js"></script>
<script src="atsucup-data.js"></script>
<script src="atsucup-core.js"></script>
<script src="user-register-modal.js"></script>
<script>
(function(){
  "use strict";
  const state = AtsuCup.state;
  const escapeHtml = AtsuCup.escapeHtml;
  AtsuCup.restore();
  // ?id= の大会を操作対象にする
  const id = new URLSearchParams(location.search).get('id');
  if(id) AtsuCup.setActive(id);

  const countBadges = document.getElementById("countBadges");
  const selectedList = document.getElementById("selectedList");
  const availableList = document.getElementById("availableList");
  const nextFlowBox = document.getElementById("nextFlowBox");
  const entryPanels = document.getElementById("entryPanels");
  const blockedBox = document.getElementById("blockedBox");
  const lockNotice = document.getElementById("lockNotice");

  // ログイン中の練習用大会、非ログイン中のDB大会など、今の自分では編集できない大会への
  // 直接アクセスをブロックする(大会詳細のisReadOnlyView/isCrossPoolと同じ考え方)
  function isBlocked(){
    const owningPool = AtsuCup.poolKindOfTournamentId(id);
    if(!id || !owningPool) return false;
    const guestNow = AtsuCup.isGuestMode();
    return (owningPool==='auth' && guestNow) || (owningPool==='guest' && !guestNow);
  }

  // 大会名を明記し、戻り先(この大会の詳細ページ)を各リンクに設定する
  const detailHref = (state.tournamentMeta && state.tournamentMeta.id) ? `tournament-detail.html?id=${encodeURIComponent(state.tournamentMeta.id)}` : 'index.html';
  const toDetailLink = document.getElementById("toDetailLink"); if(toDetailLink) toDetailLink.href = detailHref;
  const backLink = document.getElementById("backLink"); if(backLink) backLink.href = detailHref;
  const nameEl = document.getElementById("entryTournamentName"); if(nameEl && state.tournamentMeta.title) nameEl.textContent = state.tournamentMeta.title;

  function recDefaultOf(name){ return AtsuCup.pool().userRecDefaults[name] !== false; }

  // 配列を「描画用に」並び順(sortOrder)で並べたコピーを返す。元の配列は変更しない。
  // ⚠️ state.people をこれで置き換えないこと(理由は選択中リストの描画箇所のコメント参照)。
  function sortedForDisplay(list, nameOf){
    const so = AtsuCup.pool().userSortOrder || {};
    return list.slice().sort((a,b)=> (Number(so[nameOf(a)])||0) - (Number(so[nameOf(b)])||0));
  }

  // 退出時にエントリー内容をサーバーへ保存してから戻る。飛び込みエントリー・エントリー取り消し
  // (対戦表側)は従来通り「💾 進行状況を保存」でのみ反映するため、ここではフルの
  // saveTournamentToData(entries/matches込み)を使う。ゲスト(ローカル)大会・未ログイン・
  // 未編集の場合は何もせずそのまま遷移する。失敗しても遷移は止めない(大会詳細側で一度だけ警告表示)
  let exitSyncing = false;
  async function syncAndGo(href){
    const exitStatus = document.getElementById('exitStatus');
    const shouldSync = entryDirty && id
      && AtsuCup.poolKindOfTournamentId(id)==='auth'
      && !AtsuCup.isGuestMode()
      && typeof GasDB !== 'undefined' && GasDB.canWrite()
      && !isBlocked();
    if(!shouldSync || exitSyncing){ location.href = href; return; }
    exitSyncing = true;
    if(exitStatus) exitStatus.innerHTML = `<div class="empty-state" style="padding:9px 12px; font-size:12.5px;">💾 エントリー内容を保存しています...</div>`;
    try{ await AtsuCup.saveTournamentToData(id); }
    catch(e){
      console.error('[atsucup] エントリー保存に失敗しました:', e);
      sessionStorage.setItem('atsucup:syncError', (e && e.message) || String(e));
    }
    finally{ location.href = href; }
  }
  if(toDetailLink) toDetailLink.addEventListener('click', (ev)=>{ ev.preventDefault(); syncAndGo(toDetailLink.href); });
  if(backLink) backLink.addEventListener('click', (ev)=>{ ev.preventDefault(); syncAndGo(backLink.href); });

  if(new URLSearchParams(location.search).get('flow') === 'new'){
    document.getElementById('flowBanner').innerHTML = `<div class="flow-banner">✅ 大会を作成しました。続けてこの大会に参加する人を選んでください。選び終わったら下の「次へ」から組み合わせを決められます。</div>`;
  }

  function renderBadges(){
    const total = state.people.length;
    const rec = state.people.filter(p=>p.rec).length;
    const norec = total - rec;
    countBadges.innerHTML = `
      <span class="count-badge">選択中: ${total}人</span>
      <span class="count-badge muted2">📹 撮影OK: ${rec}人</span>
      <span class="count-badge muted2">🚫 撮影不可: ${norec}人</span>`;
  }

  // 1回戦のいずれかが決着した後は、この画面からの参加者追加/削除を打ち切る(進行中の対戦結果を
  // 無条件でresetDownstream()し続けると壊れてしまうため)。途中参加は対戦表の「➕途中参加」に一本化する
  function locked(){ return !AtsuCup.bracketNotStarted(); }

  // このタブでエントリー内容(参加者・撮影可否)に変更があったか。退出時にサーバー保存するか
  // どうかの判定に使う(無編集での訪問のたびに毎回API呼び出し・GitHubコミットを増やさないため)
  let entryDirty = false;

  function addToTournament(name){
    if(locked()) return;
    if(state.people.some(p=>p.name===name)) return;
    state.people.push({ name, rec: recDefaultOf(name) });
    AtsuCup.resetDownstream();
    entryDirty = true;
    renderAll();
  }

  function toggleSelect(name){
    if(locked()) return;
    const idx = state.people.findIndex(p=>p.name===name);
    if(idx>=0){ state.people.splice(idx,1); AtsuCup.resetDownstream(); entryDirty = true; renderAll(); }
    else{ addToTournament(name); }
  }

  function renderAll(){
    if(isBlocked()){
      entryPanels.style.display = 'none';
      blockedBox.style.display = 'block';
      // ログイン中に一度でもトークンを持ったが期限切れになった場合は、単なる未ログインと
      // 区別して再ログインを促す(detail-view.jsのrender()と同様、2026-07-27追加)
      const expired = typeof GoogleAuth !== 'undefined' && GoogleAuth.sessionExpired();
      blockedBox.innerHTML = expired
        ? `<div class="empty-state"><span class="big">⚠️</span>ログインの有効期限が切れました。編集するには再度ログインしてください。<br><button class="btn btn-primary" id="sessionRelBtn" style="margin-top:12px;">再ログイン</button></div>`
        : `<div class="empty-state"><span class="big">🚫</span>この大会のエントリーは編集できません。<br><a class="btn btn-ghost" href="${detailHref}" style="margin-top:12px;">大会詳細へ戻る</a></div>`;
      if(expired) document.getElementById('sessionRelBtn').addEventListener('click', ()=>{ GoogleAuth.signIn().then(renderAll).catch(()=>{}); });
      return;
    }
    entryPanels.style.display = '';
    blockedBox.style.display = 'none';
    renderBadges();

    const isLocked = locked();
    lockNotice.style.display = isLocked ? 'block' : 'none';
    if(isLocked){
      lockNotice.innerHTML = `<div class="lock-notice">🔒 対戦が始まっているため、参加者の追加/削除はできません。途中参加させたい場合は大会詳細の対戦表にある「➕途中参加」をご利用ください。</div>`;
    }

    // 今回参加する人(選択中)・2列表示。ロック中は「外す」ボタンを出さない(削除不可のため)
    selectedList.className = '';
    selectedList.innerHTML = "";
    if(!state.people.length){
      selectedList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">まだ選ばれていません。下の「登録済みユーザーから追加」からタップして選んでください。</div>`;
    }else{
      selectedList.className = 'selected-grid';
      // 🔴 表示だけ並び順に揃える。state.people の配列順は絶対に変えないこと。
      //    fromAppTournament の entryRows は t.people の順に作られ、その配列は
      //    syncSignatureOf の stableStringify に**順序込みで**入る(stableStringifyが
      //    並べ替えるのはオブジェクトのキーだけで、配列要素は並べ替えない)。
      //    並べ替えると全大会の署名が変わり、全端末で競合モーダルが誤爆する。
      sortedForDisplay(state.people, p=>p.name).forEach(person=>{
        const cell = document.createElement('div');
        cell.className = 'roster-cell selected';
        cell.innerHTML = `
          <span class="nm">${escapeHtml(person.name)}</span>
          <div class="cell-actions">
            <button class="cam-toggle-inline ${person.rec?'rec-yes':'rec-no'}" data-cam="${escapeHtml(person.name)}" title="この大会限定の撮影可否">${person.rec?'📹':'🚫'}</button>
            ${isLocked ? '' : `<button class="rm" data-toggle="${escapeHtml(person.name)}" title="今回の参加から外す">外す</button>`}
          </div>
        `;
        selectedList.appendChild(cell);
      });
    }

    // 登録済み(アーカイブ除く)だが今回は未選択の人・3列表示
    // ログイン中は本物のロースターのみ、未ログインは練習用ロースターのみを候補にする(混在させない)
    const P = AtsuCup.pool();
    // ユーザー管理画面で決めた並び順(sortOrder)で候補を出す。アーカイブ済みは除かれる
    const activeRoster = AtsuCup.orderedRoster(P);
    const unselected = activeRoster.filter(name => !state.people.some(p=>p.name===name));
    availableList.className = '';
    availableList.innerHTML = "";
    if(isLocked){
      availableList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">対戦開始後は候補一覧からの追加はできません。</div>`;
    }else if(!activeRoster.length){
      availableList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">${AtsuCup.isGuestMode() ? 'まだこの端末に登録者がいません。「新規ユーザー登録」から追加してください。' : 'まだ登録者がいません。「新規ユーザー登録」から名前を登録してください。'}</div>`;
    }else if(!unselected.length){
      availableList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">登録済みの人は全員選択中です。</div>`;
    }else{
      availableList.className = 'available-grid';
      unselected.forEach(name=>{
        const cell = document.createElement('div');
        cell.className = 'roster-cell';
        cell.dataset.select = name;
        cell.innerHTML = `<span class="nm">${escapeHtml(name)}</span><span>${recDefaultOf(name)?'📹':'🚫'}</span>`;
        availableList.appendChild(cell);
      });
    }

    if(!isLocked){
      document.querySelectorAll('[data-select]').forEach(el=>{
        el.addEventListener('click', ()=> toggleSelect(el.dataset.select));
      });
      document.querySelectorAll('[data-toggle]').forEach(el=>{
        el.addEventListener('click', (ev)=>{ ev.stopPropagation(); toggleSelect(el.dataset.toggle); });
      });
    }
    document.querySelectorAll('[data-cam]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const person = state.people.find(p=>p.name===el.dataset.cam);
        if(person){ person.rec = !person.rec; entryDirty = true; AtsuCup.persist(); renderAll(); }
      });
    });
  }

  document.getElementById("openRegisterBtn").addEventListener("click", ()=>{
    UserRegisterModal.open({
      onRegistered: async (names)=>{
        // 大会画面から登録した場合は、そのまま今回の参加者としても選出しておく
        names.forEach(addToTournament);
        renderAll();
        // ユーザーマスタが増えたので data/users.json(GitHub) にも書き戻す(練習モードでは行わない)
        const box = document.getElementById('syncStatus');
        const show = (msg, color)=>{ box.innerHTML = msg ? `<div class="empty-state" style="padding:9px 12px; font-size:12.5px; color:${color||'inherit'};">${escapeHtml(msg)}</div>` : ''; };
        if(AtsuCup.isGuestMode()){ show('練習モードです。この端末にのみ登録しました。'); return; }
        if(!GasDB.canWrite()){ show('この端末にのみ登録しました(GitHubへ反映するには「設定」でGoogleログインしてください)'); return; }
        show('GitHubへ保存中...');
        try{ const n = await AtsuCup.saveUsersToData(); show(`GitHubへ保存しました(登録者${n}人)`, '#7cffb0'); }
        catch(e){ show('GitHubへの保存に失敗しました: ' + ((e && e.message) || e), '#ff6a6a'); }
      }
    });
  });

  renderAll();
  // data/*.json(GitHub側=正)の取り込みが終わったら描き直す
  AtsuCup.ready.then(()=>{ renderAll(); });
  // ログイン状態が変わったら(このタブ内で)、候補ロースターが切り替わるので描き直す
  if(typeof GoogleAuth !== 'undefined') GoogleAuth.onStateChange(()=> renderAll());
})();
</script>
</body>
</html>
