<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>あつ杯 大会エントリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
<style>
  .flow-banner{
    background:linear-gradient(180deg,rgba(255,145,69,.18),rgba(255,106,43,.06)); border:1px solid var(--ember2);
    border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:var(--cream); line-height:1.8;
  }
  .selected-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .available-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .roster-cell{
    display:flex; align-items:center; gap:6px; min-width:0; background:#0d0a14; border:1.5px solid var(--line);
    border-radius:10px; padding:9px 8px; cursor:pointer;
  }
  .roster-cell.selected{ border-color:var(--ember2); background:linear-gradient(180deg,rgba(255,145,69,.14),rgba(255,106,43,.05)); flex-direction:column; align-items:stretch; gap:6px; }
  .roster-cell .nm{flex:1; min-width:0; font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .roster-cell .cell-actions{ display:flex; align-items:center; gap:6px; }
  .roster-cell .rm{
    flex-shrink:0; background:none; border:1px solid var(--line); border-radius:6px; color:#6b5f82; font-size:11px;
    cursor:pointer; padding:3px 6px; line-height:1;
  }
  .roster-cell .cam-toggle-inline{ flex-shrink:0; padding:2px 6px; font-size:11px; }
  .next-flow-box{ margin-top:20px; }
</style>
</head>
<body>
<a class="back-link" id="backLink" href="index.html">‹ 戻る</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark">🙋</div>
    <h1>大会エントリー</h1>
    <div class="sub" id="entryTournamentName">TOURNAMENT ENTRY</div>
  </header>

  <div id="flowBanner"></div>

  <section class="panel">
    <h2><span class="num">01</span> 今回参加する人</h2>
    <div id="countBadges"></div>
    <div id="selectedList" style="margin-top:12px;"></div>
  </section>

  <section class="panel">
    <h2><span class="num">02</span> 登録済みユーザーから追加</h2>
    <p class="hint">タップで今回の大会に追加します。まだ登録されていない人は「新規ユーザー登録」から追加できます。登録者一覧はGitHub上のdata/users.jsonから読み込みます。</p>
    <div id="syncStatus"></div>
    <div id="availableList"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-ghost" id="openRegisterBtn">➕ 新規ユーザー登録</button>
      <button class="btn btn-ghost" id="reloadBtn">🔄 再読み込み</button>
      <a class="btn btn-ghost" href="users.html">🧑‍🤝‍🧑 ユーザー管理を開く</a>
    </div>
  </section>

  <div class="next-flow-box" id="nextFlowBox">
    <a class="btn btn-gold" style="width:100%;" id="toDetailLink" href="tournament-detail.html">‹ 大会詳細に戻る</a>
  </div>

  <footer class="note">登録ユーザーはGitHub上の data/users.json で管理されます。参加者・大会・対戦結果・戦績は、この端末のブラウザ内に保存されます。</footer>
</div>

<script src="tap-ripple.js"></script>
<script src="atsucup-core.js"></script>
<script src="github-db.js"></script>
<script src="user-register-modal.js"></script>
<script>
(function(){
  "use strict";
  const state = AtsuCup.state;
  const escapeHtml = AtsuCup.escapeHtml;
  AtsuCup.restore();
  // ?id= の大会を操作対象にする
  const id = new URLSearchParams(location.search).get('id');
  if(id) AtsuCup.setActive(id);

  const USERS_PATH = "data/users.json";
  let ghUsers = [];
  let ghSha = null;
  let loadError = null;
  let loading = true;

  const countBadges = document.getElementById("countBadges");
  const selectedList = document.getElementById("selectedList");
  const availableList = document.getElementById("availableList");
  const syncStatus = document.getElementById("syncStatus");
  const nextFlowBox = document.getElementById("nextFlowBox");

  // 大会名を明記し、戻り先(この大会の詳細ページ)を各リンクに設定する
  const detailHref = (state.tournamentMeta && state.tournamentMeta.id) ? `tournament-detail.html?id=${encodeURIComponent(state.tournamentMeta.id)}` : 'index.html';
  const toDetailLink = document.getElementById("toDetailLink"); if(toDetailLink) toDetailLink.href = detailHref;
  const backLink = document.getElementById("backLink"); if(backLink) backLink.href = detailHref;
  const nameEl = document.getElementById("entryTournamentName"); if(nameEl && state.tournamentMeta.title) nameEl.textContent = state.tournamentMeta.title;

  function recDefaultOf(name){ const u = ghUsers.find(x=>x.name===name); return u ? u.recDefault !== false : true; }
  function setStatus(msg, type){
    syncStatus.innerHTML = msg ? `<div class="empty-state" style="padding:10px 12px; color:${type==='error'?'#ff6a6a':type==='ok'?'#7cffb0':'inherit'};">${escapeHtml(msg)}</div>` : '';
  }

  async function writeUsers(newList, message){
    const res = await GitHubDB.putFile(USERS_PATH, newList, message, ghSha);
    ghUsers = newList;
    ghSha = (res && res.content && res.content.sha) || null;
  }

  async function loadUsers(){
    loading = true; loadError = null;
    setStatus("読み込み中...", "");
    renderAll();
    try{
      const { data, sha } = await GitHubDB.getFile(USERS_PATH);
      ghUsers = Array.isArray(data) ? data : [];
      ghSha = sha;
      setStatus("", "");
    }catch(e){
      loadError = (e && e.message) || String(e);
      setStatus(loadError, "error");
    }finally{
      loading = false;
      renderAll();
    }
  }

  if(new URLSearchParams(location.search).get('flow') === 'new'){
    document.getElementById('flowBanner').innerHTML = `<div class="flow-banner">✅ 大会を作成しました。続けてこの大会に参加する人を選んでください。選び終わったら下の「次へ」から組み合わせを決められます。</div>`;
  }

  function renderBadges(){
    const total = state.people.length;
    const rec = state.people.filter(p=>p.rec).length;
    const norec = total - rec;
    countBadges.innerHTML = `
      <span class="count-badge">選択中: ${total}人</span>
      <span class="count-badge muted2">📹 撮影OK: ${rec}人</span>
      <span class="count-badge muted2">🚫 撮影不可: ${norec}人</span>`;
  }

  function addToTournament(name){
    if(state.people.some(p=>p.name===name)) return;
    state.people.push({ name, rec: recDefaultOf(name) });
    AtsuCup.resetDownstream();
    renderAll();
  }

  function toggleSelect(name){
    const idx = state.people.findIndex(p=>p.name===name);
    if(idx>=0){ state.people.splice(idx,1); AtsuCup.resetDownstream(); renderAll(); }
    else{ addToTournament(name); }
  }

  function renderAll(){
    renderBadges();

    // 今回参加する人(選択中)・2列表示
    selectedList.className = '';
    selectedList.innerHTML = "";
    if(!state.people.length){
      selectedList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">まだ選ばれていません。下の「登録済みユーザーから追加」からタップして選んでください。</div>`;
    }else{
      selectedList.className = 'selected-grid';
      state.people.forEach(person=>{
        const cell = document.createElement('div');
        cell.className = 'roster-cell selected';
        cell.innerHTML = `
          <span class="nm">${escapeHtml(person.name)}</span>
          <div class="cell-actions">
            <button class="cam-toggle-inline ${person.rec?'rec-yes':'rec-no'}" data-cam="${escapeHtml(person.name)}" title="この大会限定の撮影可否">${person.rec?'📹':'🚫'}</button>
            <button class="rm" data-toggle="${escapeHtml(person.name)}" title="今回の参加から外す">外す</button>
          </div>
        `;
        selectedList.appendChild(cell);
      });
    }

    // 登録済み(アーカイブ除く)だが今回は未選択の人・3列表示
    availableList.className = '';
    availableList.innerHTML = "";
    if(loading && !ghUsers.length && !loadError){
      availableList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">読み込み中...</div>`;
    }else if(loadError){
      availableList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">読み込みに失敗しました。「🔄 再読み込み」でやり直してください。</div>`;
    }else{
      const activeRoster = ghUsers.filter(u=>!u.archived);
      const unselected = activeRoster.filter(u=>!state.people.some(p=>p.name===u.name));
      if(!activeRoster.length){
        availableList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">まだ登録者がいません。「新規ユーザー登録」から名前を登録してください。</div>`;
      }else if(!unselected.length){
        availableList.innerHTML = `<div class="empty-state" style="padding:14px 4px;">登録済みの人は全員選択中です。</div>`;
      }else{
        availableList.className = 'available-grid';
        unselected.forEach(u=>{
          const cell = document.createElement('div');
          cell.className = 'roster-cell';
          cell.dataset.select = u.name;
          cell.innerHTML = `<span class="nm">${escapeHtml(u.name)}</span><span>${u.recDefault!==false?'📹':'🚫'}</span>`;
          availableList.appendChild(cell);
        });
      }
    }

    document.querySelectorAll('[data-select]').forEach(el=>{
      el.addEventListener('click', ()=> toggleSelect(el.dataset.select));
    });
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); toggleSelect(el.dataset.toggle); });
    });
    document.querySelectorAll('[data-cam]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const person = state.people.find(p=>p.name===el.dataset.cam);
        if(person){ person.rec = !person.rec; AtsuCup.persist(); renderAll(); }
      });
    });
  }

  document.getElementById("reloadBtn").addEventListener("click", loadUsers);

  document.getElementById("openRegisterBtn").addEventListener("click", ()=>{
    UserRegisterModal.open({
      existingNames: ghUsers.map(u=>u.name),
      persist: async (names)=>{
        if(!GitHubDB.hasToken()) throw new Error("GitHubトークンが未設定です。「設定」画面から登録してください。");
        const existingIds = new Set(ghUsers.map(u=>u.id));
        const newUsers = names.map(name=>{
          const id = GitHubDB.genId('u', existingIds);
          existingIds.add(id);
          return { id, name, recDefault: true, archived: false, createdAt: new Date().toISOString(), note: "" };
        });
        await writeUsers([...ghUsers, ...newUsers], `参加者を${names.length}人追加`);
      },
      onRegistered: (names)=>{
        // 大会画面から登録した場合は、そのまま今回の参加者としても選出しておく
        names.forEach(addToTournament);
        renderAll();
      }
    });
  });

  loadUsers();
})();
</script>
</body>
</html>
