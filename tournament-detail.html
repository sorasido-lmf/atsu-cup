<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>あつ杯 大会詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
<style>
  .place-row{display:flex; justify-content:space-between; align-items:center; background:#0d0a14; border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin-bottom:6px; font-size:13px;}
  .place-row .p{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); width:24px;}
  .place-row.p1{border-color:var(--gold-dim);}
  .place-row.p1 .p{color:var(--gold);}
  .confirm-banner{
    background:linear-gradient(180deg,rgba(255,77,77,.14),rgba(255,77,77,.04)); border:1px solid #ff7373;
    border-radius:14px; padding:14px; font-size:13px; color:var(--cream); line-height:1.8; margin-top:14px;
  }
  .confirm-banner .row{ margin-top:10px; }
</style>
</head>
<body>
<a class="back-link" href="tournaments.html">‹ 大会一覧へ</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark">🏆</div>
    <h1>大会詳細</h1>
    <div class="sub">TOURNAMENT DETAIL</div>
  </header>

  <section class="panel" id="content"></section>

  <footer class="note">参加者・大会・対戦結果・戦績は、すべてこの端末のブラウザ内に保存されます。</footer>
</div>

<script src="tap-ripple.js"></script>
<script src="atsucup-core.js"></script>
<script>
(function(){
  "use strict";
  const state = AtsuCup.state;
  const escapeHtml = AtsuCup.escapeHtml;
  const roundLabel = AtsuCup.roundLabel;
  AtsuCup.restore();

  const content = document.getElementById("content");
  const id = new URLSearchParams(location.search).get('id');

  let mode = 'view'; // 'view' | 'editing' | 'confirmEnd' | 'confirmDelete'

  function recMapOfEntry(entry){
    const m = {};
    (entry.participants||[]).forEach(p=> m[p.name]=p.rec);
    return m;
  }

  function isLive(){ return !!(id && state.tournamentMeta && state.tournamentMeta.id === id && state.tournamentMeta.title); }
  function findHistory(){ return state.history.find(h=>h.id===id); }

  function renderNotFound(){
    content.innerHTML = `<div class="empty-state"><span class="big">🔍</span>大会が見つかりません。<br><a class="btn btn-ghost" href="tournaments.html" style="margin-top:12px;">大会一覧へ戻る</a></div>`;
  }

  function renderEditForm(){
    const meta = state.tournamentMeta;
    content.innerHTML = `
      <div class="video-card">
        <div class="field" style="margin-bottom:8px;"><label>大会名</label><input type="text" id="tfTitle" value="${escapeHtml(meta.title)}"></div>
        <div class="field" style="margin-bottom:8px;"><label>詳細・ルール</label><textarea id="tfDetails" style="min-height:100px;">${escapeHtml(meta.details||'')}</textarea></div>
        <div class="field" style="margin-bottom:8px;"><label>告知ポスター画像</label><input type="file" id="tfPoster" accept="image/*"></div>
        <div class="row">
          <button class="btn btn-primary" id="tfSave">更新する</button>
          <button class="btn btn-ghost" id="tfCancel">キャンセル</button>
        </div>
      </div>
    `;
    document.getElementById("tfCancel").addEventListener("click", ()=>{ mode='view'; render(); });
    document.getElementById("tfSave").addEventListener("click", async ()=>{
      const title = document.getElementById("tfTitle").value.trim();
      const details = document.getElementById("tfDetails").value.trim();
      const fileInput = document.getElementById("tfPoster");
      if(!title){ alert("大会名を入力してください。"); return; }
      const saveBtn = document.getElementById("tfSave");
      saveBtn.disabled = true; saveBtn.textContent = "保存中...";
      try{
        let posterUrl = meta.posterUrl;
        if(fileInput.files && fileInput.files[0]){
          posterUrl = await AtsuCup.resizeImageToDataUrl(fileInput.files[0], 900, 0.75);
        }
        state.tournamentMeta = { id: meta.id, title, details, posterUrl };
        AtsuCup.persist();
        mode = 'view';
        render();
      }catch(e){
        alert("保存に失敗しました: " + (e.message||e));
        saveBtn.disabled = false; saveBtn.textContent = "更新する";
      }
    });
  }

  function renderLive(){
    if(mode === 'editing'){ renderEditForm(); return; }

    const meta = state.tournamentMeta;
    const statusBadge = state.winnerName
      ? `<span class="status-badge done">優勝者決定</span>`
      : `<span class="status-badge open">進行中</span>`;
    const hasPairing = state.matches.length>0 && state.matches[0].length>0 && state.remaining.length===0;
    const progressHref = state.winnerName ? "results.html" : hasPairing ? "bracket.html" : "matchup.html";
    const progressLabel = state.winnerName ? "🏆 最終結果を見る" : hasPairing ? "🏆 対戦表を見る・対戦を進める" : "🎲 組み合わせを決める";

    const confirmHtml = mode === 'confirmEnd' ? `
      <div class="confirm-banner">
        ${state.winnerName ? "この大会を終了して「大会一覧」に保存します。よろしいですか？" : "この大会はまだ優勝者が決まっていません。それでも終了して「大会一覧」に保存しますか？"}
        <div class="row">
          <button class="btn btn-primary" id="confirmEndBtn">終了する</button>
          <button class="btn btn-ghost" id="cancelEndBtn">キャンセル</button>
        </div>
      </div>
    ` : '';

    content.innerHTML = `
      ${statusBadge}
      ${meta.posterUrl?`<img class="poster-img" src="${escapeHtml(meta.posterUrl)}" alt="poster">`:''}
      <div class="cur-title">${escapeHtml(meta.title)}</div>
      <div class="cur-details">${escapeHtml(meta.details||'')}</div>
      ${state.winnerName?`<div class="cur-line champ">👑 優勝: ${escapeHtml(state.winnerName)}</div>`:''}
      ${state.thirdPlaceMatch&&state.thirdPlaceMatch.winner?`<div class="cur-line third">🥉 3位: ${escapeHtml(state.thirdPlaceMatch.winner)}</div>`:''}
      <div class="row">
        <a class="btn btn-gold" href="${progressHref}">${progressLabel}</a>
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="editBtn">編集する</button>
        <button class="btn btn-ghost" id="endBtn">この大会を終了する</button>
      </div>
      ${confirmHtml}
    `;
    document.getElementById("editBtn").addEventListener("click", ()=>{ mode='editing'; render(); });
    document.getElementById("endBtn").addEventListener("click", ()=>{ mode='confirmEnd'; render(); });
    if(mode === 'confirmEnd'){
      document.getElementById("cancelEndBtn").addEventListener("click", ()=>{ mode='view'; render(); });
      document.getElementById("confirmEndBtn").addEventListener("click", ()=>{
        AtsuCup.endCurrentTournament();
        mode = 'view';
        render();
      });
    }
  }

  function renderPast(h){
    const placements = AtsuCup.computePlacements(h);
    const rows = (h.participants||[]).map(p=>({ name:p.name, ...(placements[p.name]||{place:null,label:'参加'}) }));
    rows.sort((a,b)=> (a.place||99) - (b.place||99));
    const date = h.createdAt ? new Date(h.createdAt).toLocaleDateString('ja-JP') : '';
    const recMap = recMapOfEntry(h);

    const matchRounds = (h.matches||[]).map((round)=>{
      return round.map(m=>{
        if(m.b===null){
          return `<div class="video-card"><div class="vs"><span class="rlabel">${roundLabel(round.length)}</span> ${escapeHtml(m.a)} <span class="rlabel">BYE(不戦勝)</span></div></div>`;
        }
        return `<div class="video-card">
          <div class="vs"><span class="rlabel">${roundLabel(round.length)}</span> ${escapeHtml(m.a)}${recMap[m.a]?'📹':'🚫'} vs ${escapeHtml(m.b)}${recMap[m.b]?'📹':'🚫'} ${m.winner?`<span class="rlabel">勝者: ${escapeHtml(m.winner)}</span>`:'<span class="rlabel">未決着</span>'}</div>
          ${AtsuCup.videoEmbedHtml(m.video)}
        </div>`;
      }).join('');
    }).join('');

    let thirdHtml = '';
    if(h.thirdPlaceMatch){
      const tp = h.thirdPlaceMatch;
      thirdHtml = `<div class="video-card">
        <div class="vs"><span class="rlabel">3位決定戦</span> ${escapeHtml(tp.a)} vs ${escapeHtml(tp.b)} ${tp.winner?`<span class="rlabel">勝者: ${escapeHtml(tp.winner)}</span>`:'<span class="rlabel">未決着</span>'}</div>
      </div>`;
    }

    const confirmHtml = mode === 'confirmDelete' ? `
      <div class="confirm-banner">
        「${escapeHtml(h.title)}」を大会一覧から削除します。よろしいですか？(元に戻せません)
        <div class="row">
          <button class="btn btn-primary" id="confirmDeleteBtn">削除する</button>
          <button class="btn btn-ghost" id="cancelDeleteBtn">キャンセル</button>
        </div>
      </div>
    ` : '';

    content.innerHTML = `
      <div class="row" style="margin-top:0;">
        <button class="btn btn-ghost" id="deleteBtn" style="color:#ff7373;">🗑️ この大会を削除</button>
      </div>
      <div class="video-card" style="margin-top:14px;">
        ${h.posterUrl?`<img class="poster-img" src="${escapeHtml(h.posterUrl)}" alt="poster">`:''}
        <div class="cur-title">${escapeHtml(h.title)}</div>
        ${h.details?`<div class="cur-details">${escapeHtml(h.details)}</div>`:''}
        ${date?`<div class="cur-details" style="color:var(--muted);">開催日: ${date}</div>`:''}
        ${h.championName?`<div class="cur-line champ">👑 優勝: ${escapeHtml(h.championName)}</div>`:'<div class="cur-line" style="color:var(--muted);">結果未記録(途中終了)</div>'}
      </div>

      <h3 class="section-title" style="margin-top:18px;">🏅 順位</h3>
      ${rows.map(r=>`<div class="place-row ${r.place===1?'p1':''}"><span class="p">${r.place?('#'+r.place):'-'}</span><span style="flex:1;">${escapeHtml(r.name)}</span><span>${escapeHtml(r.label)}</span></div>`).join('') || '<div class="empty-state" style="padding:12px;">参加者データがありません。</div>'}

      <h3 class="section-title" style="margin-top:18px;">⚔️ 対戦結果</h3>
      ${matchRounds || '<div class="empty-state" style="padding:12px;">対戦データがありません。</div>'}
      ${thirdHtml}
      ${confirmHtml}
    `;
    document.getElementById("deleteBtn").addEventListener("click", ()=>{ mode='confirmDelete'; render(); });
    if(mode === 'confirmDelete'){
      document.getElementById("cancelDeleteBtn").addEventListener("click", ()=>{ mode='view'; render(); });
      document.getElementById("confirmDeleteBtn").addEventListener("click", ()=>{
        state.history = state.history.filter(x=>x.id!==h.id);
        AtsuCup.persist();
        location.href = "tournaments.html";
      });
    }
    window.scrollTo({top:0, behavior:'instant'});
  }

  function render(){
    if(!id){ renderNotFound(); return; }
    if(isLive()){ renderLive(); return; }
    const h = findHistory();
    if(h){ renderPast(h); return; }
    renderNotFound();
  }

  render();
})();
</script>
</body>
</html>
