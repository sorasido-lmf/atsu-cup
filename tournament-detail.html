<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>あつ杯 大会詳細</title>
<link rel="icon" type="image/png" href="assets/icons/headings/page-home-v1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
<style>
  /* ---- 過去大会詳細 ---- */
  .place-row{display:flex; justify-content:space-between; align-items:center; background:#fffdf7; border:1px solid var(--stone-beige); border-radius:8px; padding:9px 12px; margin-bottom:6px; font-size:13px;}
  .place-row .p{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); width:24px;}
  .place-row.p1{border-color:var(--gold-dim);}
  .place-row.p1 .p{color:var(--gold);}
  .confirm-banner{
    background:linear-gradient(180deg,rgba(255,77,77,.14),rgba(255,77,77,.04)); border:1px solid #ff7373;
    border-radius:14px; padding:14px; font-size:13px; color:var(--cream); line-height:1.8; margin-top:14px;
  }
  .confirm-banner .row{ margin-top:10px; }

  /* ---- 共通 ---- */
  .avatar{
    width:30px; height:30px; border-radius:50%; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
    color:var(--gold); flex-shrink:0;
  }
  .vs-label{ align-self:center; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; }
  .warn-box{
    margin-top:14px; background:#241214; border:1px solid #5a2222; border-radius:10px; padding:10px 12px;
    font-size:12px; color:#ffb3b3; line-height:1.8;
  }

  /* ---- 組み合わせ決定(matchup) ---- */
  .decide-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .decide-tabs button{flex:1; margin-top:0;}
  .order-list{margin-top:14px; display:flex; flex-direction:column; gap:6px;}
  .order-item{
    display:flex; align-items:center; gap:8px; color:var(--fantasy-text); background:#fffdf7; border:1px solid var(--stone-beige);
    border-radius:10px; padding:9px 10px; font-size:13px; touch-action:pan-y;
  }
  .order-item.dragging{ box-shadow:0 8px 22px rgba(0,0,0,.5); border-color:var(--ember2); z-index:20; position:relative; }
  .order-item.is-seed{ border-color:var(--antique-gold); background:#fff2b8; }
  .seed-toggle-btn, .remove-btn{
    flex-shrink:0; background:#fffdf7; border:1px solid var(--stone-beige); border-radius:6px; color:var(--fantasy-muted);
    font-size:13px; padding:5px 8px; cursor:pointer;
  }
  .seed-toggle-btn.active{ background:#fff2b8; border-color:var(--antique-gold); color:var(--dark-cocoa); }
  .remove-btn{ color:var(--theme-danger); }
  .order-item .drag-handle{
    flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:18px; cursor:grab; touch-action:none; border-radius:6px;
  }
  .order-item .drag-handle:active{ cursor:grabbing; background:rgba(255,255,255,.08); }
  .order-item .idx{font-family:'JetBrains Mono',monospace; color:var(--frame-brown); width:20px; text-align:right; font-size:12px; flex-shrink:0;}
  .order-item .nm-edit{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:6px 4px; border-radius:6px; cursor:text;}
  .order-item .nm-edit:active{ background:rgba(255,255,255,.08); }
  .order-item .nm-edit-input{
    flex:1; min-width:0; background:#fffdf7; border:1px solid var(--antique-gold); color:var(--fantasy-text);
    border-radius:6px; padding:5px 8px; font-size:13px; font-family:'Noto Sans JP',sans-serif;
  }
  .order-item .cam{font-size:12px; opacity:.8; flex-shrink:0;}
  .manual-seed-label{font-size:12px; font-weight:900; color:var(--dark-cocoa); margin:14px 0 8px; letter-spacing:.04em;}
  .seed-chip-list{display:flex; flex-wrap:wrap; gap:8px;}
  .seed-chip{
    background:#fffdf7; border:1px solid var(--stone-beige); color:var(--fantasy-text); border-radius:999px;
    padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .seed-chip.active{ background:linear-gradient(90deg,#fff2b8,#fffaf0); border-color:var(--antique-gold); color:var(--dark-cocoa); }
  .pairing-list{display:flex; flex-direction:column; gap:10px;}
  .pair-card{color:var(--fantasy-text); background:#fffdf7; border:1px solid var(--stone-beige); border-radius:12px; padding:10px;}
  .pair-row{display:flex; align-items:center; gap:8px;}
  .pair-slot{
    flex:1; display:flex; align-items:center; gap:4px; min-width:0; background:var(--pale-marble); border:1px solid var(--stone-beige);
    border-radius:10px; padding:8px 6px;
  }
  .pair-slot.bye{ color:var(--muted); font-style:italic; justify-content:center; }
  .pair-slot.pending{ color:var(--muted); justify-content:center; letter-spacing:.05em; }
  .pair-slot .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:text; padding:3px 2px; border-radius:6px;}
  .pair-slot .nm:active{ background:rgba(255,255,255,.1); }
  .pair-slot .cam-mark{font-size:11px; opacity:.8; flex-shrink:0;}
  .pair-vs{color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px; flex-shrink:0;}
  .drag-handle-sm{
    flex-shrink:0; width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:16px; cursor:grab; touch-action:none;
  }
  .pair-slot.forced{ border-color:#7a2c2c; box-shadow:0 0 0 1px #7a2c2c inset; }
  .pair-slot.drop-target{ background:rgba(255,106,43,.28); outline:2px solid var(--ember2); outline-offset:-2px; }
  .pair-slot.dragging-slot{ box-shadow:0 10px 26px rgba(0,0,0,.6); z-index:30; position:relative; }
  @keyframes atsuFlash{ 0%{box-shadow:0 0 0 0 rgba(255,106,43,.6);} 100%{box-shadow:0 0 0 10px rgba(255,106,43,0);} }
  .flash-highlight{ animation:atsuFlash 1s ease-out; border-color:var(--ember2) !important; }

  /* ---- ルーレットモーダル ---- */
  .roulette-modal{ position:fixed; inset:0; z-index:2147483000; display:flex; align-items:center; justify-content:center; padding:20px; }
  .roulette-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(2px); }
  .roulette-card{
    position:relative; width:100%; max-width:340px; color:var(--fantasy-text); background:var(--pale-marble);
    border:1.5px solid var(--frame-brown); border-radius:18px; padding:22px 18px; box-shadow:0 20px 60px rgba(56,35,15,.36);
    display:flex; flex-direction:column; align-items:center;
  }
  .wheel-holder{position:relative; width:260px; height:260px; margin:0 auto;}
  .pointer{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-top:22px solid var(--gold);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); z-index:5;
  }
  canvas#wheel{border-radius:50%; box-shadow:0 0 0 4px #0d0a14, 0 0 0 6px var(--gold-dim), 0 10px 30px rgba(0,0,0,.5);}
  .wheel-center{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:60px; height:60px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, #3a2c14, #14100a); border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center; z-index:4; font-size:20px;
    box-shadow:0 0 14px rgba(232,179,76,.4);
  }
  .picked-banner{
    margin:16px 0 6px; text-align:center; min-height:34px; font-family:'Noto Sans JP',sans-serif;
    font-size:19px; font-weight:900; color:var(--gold); text-shadow:0 0 12px rgba(232,179,76,.5);
  }
  .picked-banner.seed{
    color:#fff2da; text-shadow:0 0 22px rgba(232,179,76,.95), 0 0 40px rgba(255,106,43,.6);
    animation:atsuSeedPulse 650ms ease-in-out 2;
  }
  @keyframes atsuSeedPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.16);} }
  .seed-particle{
    position:fixed; font-size:22px; pointer-events:none; z-index:2147483600;
    animation:atsuSeedFly 900ms ease-out forwards;
  }
  @keyframes atsuSeedFly{
    0%{ transform:translate(-50%,-50%) scale(.5); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15); opacity:0; }
  }

  /* ---- 対戦表(bracket) ---- */
  .tree-title{font-family:'Noto Sans JP',sans-serif; font-weight:900; font-size:15px; color:var(--dark-cocoa); margin-bottom:2px;}
  .tree-scroll{
    /* 縦方向は内側の別スクロール箱にせず、ページ全体の通常スクロールに任せる方針
       (2026-07-27変更。以前はoverflow-y:auto+max-height:92vhで内箱化していたが、
       大人数の大会でネストしたスクロール領域になり使いづらいという指摘のため撤廃)。
       横方向は対戦表の列数が多いラウンドで従来通りスクロール可能にする。 */
    overflow-x:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
    border-radius:16px; border:1.5px solid var(--frame-brown);
    background:rgba(247,244,234,.94); padding:8px 0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.72),inset -12px 0 18px -18px rgba(94,64,35,.5);
    scrollbar-color:var(--antique-gold) var(--warm-sand); scrollbar-width:thin;
    /* iOSでエントリー名を長押しした際に、D&Dより先にテキスト選択/コピーの吹き出しが
       出てしまいドラッグが妨げられるのを防ぐ(実機のみで再現、2026-07-27) */
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .tree-scroll svg{ display:block; width:max(100%, var(--svg-natural-w, 0px)); max-width:none; height:auto; }
  .tree-canvas-bg{ fill:rgba(247,244,234,.80); }
  .tree-round-frame{ fill:none; stroke:rgba(138,98,50,.22); }
  .tree-round-label{ fill:var(--dark-cocoa); }
  .tree-connector{ fill:none; stroke:var(--frame-brown); }
  .tree-slot rect{ fill:#fffdf7; stroke:var(--stone-beige); }
  .tree-slot .tree-name{ fill:var(--fantasy-text); }
  .tree-slot.is-winner{ opacity:1; }
  .tree-slot.is-winner rect{ fill:#fff2b8; stroke:var(--antique-gold); }
  .tree-slot.is-winner .tree-name{ fill:var(--dark-cocoa); }
  .tree-slot.is-loser{ opacity:.52; }
  .tree-slot.is-forced rect{ stroke:var(--theme-danger); }
  .tree-slot.is-seed-win rect{ stroke-dasharray:3 3; }
  .tree-seed-tag,.tree-seed-label{ fill:var(--fantasy-muted); }
  .tree-seed-box,.tree-slot rect.tree-seed-box{ fill:#f2ead8; stroke:var(--stone-beige); stroke-dasharray:3 3; }
  .tree-pending-box,.tree-slot rect.tree-pending-box{ fill:#eee4cf; stroke:var(--stone-beige); }
  .tree-pending-label{ fill:#806c53; }
  .tree-slot-action-box,.tree-slot rect.tree-slot-action-box{ fill:#fff8e7; stroke:var(--antique-gold); stroke-dasharray:3 3; }
  .tree-slot-action-label{ fill:var(--dark-cocoa); }
  .tree-pick-button{ fill:#fff2b8; stroke:var(--antique-gold); }
  .tree-pick{ cursor:pointer; }
  .tree-pick circle{ transition: fill .12s ease; }
  .tree-pick:active circle{ fill:#3a2c14 !important; }
  .tree-add-icon{ cursor:pointer; }
  .tree-add-icon:active{ opacity:.5; }
  @keyframes treePickFlash{ 0%{ transform:scale(1.6); } 100%{ transform:scale(1); } }
  .tree-pick.tree-flash circle{ animation: treePickFlash 1.1s ease-out; transform-origin:center; transform-box:fill-box; }
  .advance-warn{ margin-top:10px; background:#241214; border:1px solid #5a2222; border-radius:10px; padding:10px 12px; font-size:12.5px; color:#ffb3b3; line-height:1.7; }
  .tree-slot[data-dnd="1"]{ cursor:grab; touch-action:none; }
  .tree-slot-tap{ cursor:pointer; }
  .tree-slot.dragging{ opacity:.35; }
  .tree-slot.drop-hover rect{ stroke:#e8b34c !important; stroke-width:3 !important; }
  .tree-card-drag{ cursor:grab; touch-action:none; }
  .tree-card-drag.dragging{ opacity:.35; }
  .tree-card-hoverzone.drop-hover{ stroke:#e8b34c !important; }
  .dnd-ghost{
    position:fixed; z-index:2147483000; pointer-events:none; transform:translate(-50%,-50%);
    background:#fff1b8; border:1.5px solid var(--antique-gold); border-radius:10px; padding:8px 12px;
    font-weight:700; font-size:13px; color:var(--cream); box-shadow:0 10px 30px rgba(0,0,0,.5); white-space:nowrap;
  }
  .dnd-unassign-zone{
    position:fixed; left:14px; right:14px; bottom:14px; z-index:2147482999; display:none;
    align-items:center; justify-content:center; height:56px; border-radius:14px;
    background:rgba(36,18,20,.92); border:1.5px dashed #5a2222; color:#ffb3b3; font-weight:700; font-size:13px;
  }
  .dnd-unassign-zone.active{ display:flex; }
  .dnd-unassign-zone.drop-hover{ background:rgba(90,34,34,.95); border-color:#ff7373; color:#fff; }
  .swap-note{
    margin-top:8px; font-size:11.5px; color:var(--fantasy-muted); background:#f2ead8; border:1px solid var(--stone-beige);
    border-radius:8px; padding:6px 9px; display:flex; align-items:center; gap:6px; font-weight:700;
  }
  .champion-box{
    margin-top:18px; text-align:center; padding:22px 14px; border-radius:14px;
    background:radial-gradient(circle at 50% 0%, rgba(255,216,92,.45), transparent 72%),var(--pale-marble);
    border:1.5px solid var(--antique-gold); box-shadow:var(--fantasy-panel-shadow);
  }
  .champion-box .label{font-size:11px; letter-spacing:.2em; color:var(--fantasy-muted); text-transform:uppercase;}
  .champion-box .name{
    font-family:'Noto Sans JP',sans-serif; font-weight:900; font-size:26px; color:var(--dark-cocoa);
    margin:6px 0 14px; text-shadow:0 1px 0 #fff,0 0 14px rgba(255,216,92,.58);
  }
  .champion-box .place-row{
    color:var(--fantasy-text); background:#fffdf7; border-color:var(--stone-beige);
  }
  .champion-box .place-row.p1{
    background:#fff2b8; border-color:var(--antique-gold);
  }
  .champion-box .place-row .p{ color:var(--fantasy-muted); }
  .champion-box .place-row.p1 .p{ color:var(--dark-cocoa); }
  .match-pick-modal{ position:fixed; inset:0; z-index:2147483000; display:flex; align-items:center; justify-content:center; padding:20px; }
  .match-pick-modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.62); backdrop-filter:blur(2px); }
  .match-pick-modal-card{
    position:relative; width:100%; max-width:360px; color:var(--fantasy-text); background:var(--pale-marble);
    border:1.5px solid var(--frame-brown); border-radius:18px; padding:20px 18px; box-shadow:0 20px 60px rgba(56,35,15,.36);
  }
  .match-pick-modal-title{
    text-align:center; font-size:11px; letter-spacing:.15em; color:var(--dark-cocoa); font-weight:900;
    text-transform:uppercase; margin-bottom:14px;
  }
  .match-pick-modal-row{ display:flex; flex-direction:column; gap:10px; align-items:stretch; }
  .match-pick-modal-row .vs-label{ text-align:center; }
  .modal-pick-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    background:#fffdf7; border:1.5px solid var(--stone-beige); border-radius:12px; color:var(--fantasy-text);
    font-weight:900; font-size:17px; padding:16px 18px; cursor:pointer; font-family:'Noto Sans JP',sans-serif;
  }
  .modal-pick-btn .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modal-pick-btn:active{ background:rgba(255,255,255,.08); }
  .modal-pick-btn.winner{ background:linear-gradient(90deg,#fff2b8,#fffaf0); border-color:var(--antique-gold); color:var(--dark-cocoa); }
</style>
</head>
<body class="page-scene page-tournament-list">
<a class="back-link" href="tournaments.html">‹ 大会一覧へ</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark"><img class="page-heading-icon" src="assets/icons/headings/page-tournament-v1.png" alt="" width="64" height="64"></div>
    <h1>大会詳細</h1>
    <div class="sub">TOURNAMENT DETAIL</div>
  </header>

  <section class="panel" id="content"></section>
  <section class="panel" id="matchupSection" style="display:none;"></section>
  <section class="panel" id="bracketSection" style="display:none;"></section>

  <footer class="note">参加者・大会・対戦結果・戦績は、すべてこの端末のブラウザ内に保存されます。</footer>
  <datalist id="rosterCandidates"></datalist>
</div>

<script src="tap-ripple.js"></script>
<script src="gas-config.js"></script>
<script src="google-auth.js"></script>
<script src="gas-db.js"></script>
<script src="atsucup-data.js"></script>
<script src="atsucup-core.js"></script>
<script src="user-register-modal.js"></script>
<script src="walkin-modal.js"></script>
<script src="detail-view.js"></script>
</body>
</html>
