<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>あつ杯 設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
<style>
  .signout-confirm{
    margin-top:10px; background:#241214; border:1px solid #5a2222; border-radius:10px; padding:10px 12px;
    font-size:12.5px; color:#ffb3b3; line-height:1.7;
  }
  .signout-confirm .row{ margin-top:8px; }
</style>
</head>
<body>
<a class="back-link" href="index.html">‹ トップへ</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark">⚙️</div>
    <h1>設定</h1>
    <div class="sub">SETTINGS</div>
  </header>

  <section class="panel">
    <h2><span class="num">01</span> Googleログイン</h2>
    <p class="hint">
      大会結果・参加者情報の保存にはGoogleログインが必要です。ログインしていなくても、
      これまでの記録の閲覧はできます。保存できるのは、あらかじめ許可されたアカウントのみです。
    </p>
    <div id="authState" class="empty-state" style="padding:10px 12px; margin-bottom:12px;"></div>
    <div id="signinArea"></div>
    <div id="signedInArea" style="display:none;">
      <div class="row">
        <button class="btn btn-ghost" id="testBtn">接続確認</button>
        <button class="btn btn-ghost" id="signOutBtn">ログアウト</button>
      </div>
      <div id="signoutConfirm"></div>
    </div>
    <div id="statusBox" style="margin-top:12px;"></div>
  </section>

  <footer class="note">ログイン状態はこの端末のブラウザ内(sessionStorage)にのみ保存されます。</footer>
</div>

<script src="gas-config.js"></script>
<script src="google-auth.js"></script>
<script src="gas-db.js"></script>
<script src="atsucup-data.js"></script>
<script src="atsucup-core.js"></script>
<script>
(function(){
  "use strict";
  AtsuCup.restore(); // ログイン操作の起点となるページなので、ゲストプールの状態を先に読み込んでおく
  const authState = document.getElementById("authState");
  const signinArea = document.getElementById("signinArea");
  const signedInArea = document.getElementById("signedInArea");
  const statusBox = document.getElementById("statusBox");
  const signoutConfirm = document.getElementById("signoutConfirm");

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function setStatus(msg, type){
    statusBox.innerHTML = msg
      ? `<div class="empty-state" style="padding:10px 12px; color:${type==='error'?'#ff6a6a':type==='ok'?'#7cffb0':'inherit'};">${msg}</div>`
      : '';
  }

  function renderAuth(){
    const s = GoogleAuth.getState();
    if(s.signedIn){
      authState.innerHTML = `✅ ログイン中: <b>${escapeHtml(s.email)}</b>`;
      signinArea.style.display = 'none';
      signedInArea.style.display = 'block';
    }else{
      const g = AtsuCup.guestPool();
      const guestNote = (g.roster.length || g.tournaments.length)
        ? `<br><span style="color:var(--muted);">練習用データ: 参加者${g.roster.length}人・大会${g.tournaments.length}件(ログインすると削除されます)</span>`
        : '';
      authState.innerHTML = '未ログインです。下のボタンからログインしてください。' + guestNote;
      signinArea.style.display = 'block';
      signedInArea.style.display = 'none';
      signoutConfirm.innerHTML = '';
      setStatus('');
    }
  }

  document.getElementById("testBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("testBtn");
    btn.disabled = true; btn.textContent = "確認中...";
    try{
      const r = await GasDB.ping();
      setStatus(`✅ 接続成功: ${escapeHtml(r.email)}(${escapeHtml(r.role)})`, "ok");
    }catch(e){
      if(e.code === 'FORBIDDEN'){
        setStatus(`❌ ${escapeHtml(e.message)}(このアカウントには編集権限がありません。管理者に追加を依頼してください)`, "error");
      }else{
        setStatus(`❌ ${escapeHtml(e.message||e)}`, "error");
      }
    }finally{
      btn.disabled = false; btn.textContent = "接続確認";
    }
  });

  // ネイティブconfirm()は使わず、インラインの確認バナーでログアウトを確認する
  document.getElementById("signOutBtn").addEventListener("click", ()=>{
    signoutConfirm.innerHTML = `
      <div class="signout-confirm">
        ログアウトしますか？
        <div class="row"><button class="btn btn-primary" id="confirmSignOutBtn">ログアウトする</button><button class="btn btn-ghost" id="cancelSignOutBtn">キャンセル</button></div>
      </div>`;
    document.getElementById("confirmSignOutBtn").addEventListener("click", ()=>{
      GoogleAuth.signOut();
      setStatus('ログアウトしました。', '');
      renderAuth();
    });
    document.getElementById("cancelSignOutBtn").addEventListener("click", ()=>{ signoutConfirm.innerHTML = ''; });
  });

  GoogleAuth.onStateChange(renderAuth);

  if(!(typeof AtsuCupGasConfig !== 'undefined' && AtsuCupGasConfig.OAUTH_CLIENT_ID)){
    authState.innerHTML = '⚠️ gas-config.js が未設定です。';
  }else{
    GoogleAuth.renderButton(signinArea).catch(e=>{
      signinArea.innerHTML = `<div class="empty-state" style="padding:10px 12px; color:#ff6a6a;">ログインボタンの表示に失敗しました: ${e.message}</div>`;
    });
  }
  renderAuth();
})();
</script>
</body>
</html>
