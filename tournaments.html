<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>あつ杯 大会一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
</head>
<body>
<a class="back-link" href="index.html">‹ トップへ</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark">📜</div>
    <h1>大会一覧</h1>
    <div class="sub">TOURNAMENTS</div>
  </header>

  <section class="panel">
    <h2>大会一覧</h2>
    <p class="hint">タップすると、その大会の詳細(順位・対戦結果・動画)を確認できます。</p>
    <div id="tournamentList"></div>
  </section>

  <footer class="note">大会・参加者・対戦結果・戦績は、すべてこの端末のブラウザ内に保存されます。</footer>
</div>

<script src="tap-ripple.js"></script>
<script src="atsucup-core.js"></script>
<script>
(function(){
  "use strict";
  const state = AtsuCup.state;
  const escapeHtml = AtsuCup.escapeHtml;
  AtsuCup.restore();

  const tournamentList = document.getElementById('tournamentList');

  function renderList(){
    tournamentList.innerHTML = "";
    const hasLive = state.tournamentMeta && state.tournamentMeta.id && state.tournamentMeta.title;
    if(!hasLive && !state.history.length){
      tournamentList.innerHTML = `<div class="empty-state" style="padding:16px 10px;">大会はまだありません。<br>トップページの「大会を作成する」から作成してください。</div>`;
      return;
    }

    if(hasLive){
      const meta = state.tournamentMeta;
      const el = document.createElement("div");
      el.className = "past-tournament-item";
      el.innerHTML = `
        ${meta.posterUrl?`<img src="${escapeHtml(meta.posterUrl)}" alt="">`:`<div class="noimg">🏆</div>`}
        <div class="meta">
          <div class="t">${escapeHtml(meta.title)}</div>
          <div class="c"><span class="status-badge open" style="padding:2px 8px; font-size:10.5px;">進行中</span></div>
        </div>
        <div class="arrow">›</div>
      `;
      el.addEventListener("click", ()=> location.href = `tournament-detail.html?id=${encodeURIComponent(meta.id)}`);
      tournamentList.appendChild(el);
    }

    state.history.slice().reverse().forEach(h=>{
      const el = document.createElement("div");
      el.className = "past-tournament-item";
      el.innerHTML = `
        ${h.posterUrl?`<img src="${escapeHtml(h.posterUrl)}" alt="">`:`<div class="noimg">🏆</div>`}
        <div class="meta">
          <div class="t">${escapeHtml(h.title)}</div>
          <div class="c">${h.championName?'👑 '+escapeHtml(h.championName):'結果未記録'}</div>
        </div>
        <div class="arrow">›</div>
      `;
      el.addEventListener("click", ()=> location.href = `tournament-detail.html?id=${encodeURIComponent(h.id)}`);
      tournamentList.appendChild(el);
    });
  }

  renderList();
})();
</script>
</body>
</html>
