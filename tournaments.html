<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>あつ杯 大会一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
</head>
<body>
<a class="back-link" href="index.html">‹ トップへ</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark">📜</div>
    <h1>大会一覧</h1>
    <div class="sub">TOURNAMENTS</div>
  </header>

  <section class="panel">
    <h2>大会一覧</h2>
    <p class="hint">タップすると、その大会の詳細(順位・対戦結果・動画)を確認できます。「ローカル」タグの大会は、この端末にのみ保存された練習用の大会です(記録には残りません)。</p>
    <div id="tournamentList"></div>
  </section>

  <footer class="note">大会・参加者・対戦結果・戦績は、すべてこの端末のブラウザ内に保存されます。</footer>
</div>

<script src="tap-ripple.js"></script>
<script src="gas-config.js"></script>
<script src="google-auth.js"></script>
<script src="gas-db.js"></script>
<script src="atsucup-data.js"></script>
<script src="atsucup-core.js"></script>
<script>
(function(){
  "use strict";
  const state = AtsuCup.state;
  const escapeHtml = AtsuCup.escapeHtml;
  AtsuCup.restore();

  const tournamentList = document.getElementById('tournamentList');

  function renderTournamentItems(container, list){
    container.innerHTML = "";
    if(!list.length){
      container.innerHTML = `<div class="empty-state" style="padding:16px 10px;">大会はまだありません。<br>トップページの「大会を作成する」から作成してください。</div>`;
      return;
    }
    // 進行中を先頭に、それぞれ新しい順に並べる(複数同時進行に対応)。
    // ゲスト/認証プールを結合したリストなので、配列の並び順(挿入順+reverse)ではなく
    // createdAtで直接ソートする(でないとプールごとに固まって「新しい順」が崩れる)。
    const byNewest = (a,b)=> new Date(b.createdAt) - new Date(a.createdAt);
    const ongoing = list.filter(t=>t.status==='ongoing').slice().sort(byNewest);
    const completed = list.filter(t=>t.status==='completed').slice().sort(byNewest);
    [...ongoing, ...completed].forEach(t=>{
      const localTag = t.pool==='guest' ? ' <span class="status-badge open" style="background:none; border:1px solid var(--line); padding:2px 8px; font-size:10.5px;">ローカル</span>' : '';
      const statusHtml = (t.status==='ongoing'
        ? `<span class="status-badge open" style="padding:2px 8px; font-size:10.5px;">進行中</span>`
        : (t.winnerName ? '👑 '+escapeHtml(t.winnerName) : '結果未記録')) + localTag;
      const el = document.createElement("div");
      el.className = "past-tournament-item";
      el.innerHTML = `
        ${t.posterUrl?`<img src="${escapeHtml(t.posterUrl)}" alt="">`:`<div class="noimg">🏆</div>`}
        <div class="meta">
          <div class="t">${escapeHtml(t.title)}</div>
          <div class="c">${statusHtml}</div>
        </div>
        <div class="arrow">›</div>
      `;
      el.addEventListener("click", ()=> location.href = `tournament-detail.html?id=${encodeURIComponent(t.id)}`);
      container.appendChild(el);
    });
  }

  function renderList(){
    // 練習用(ゲスト)と認証済み(DB)の大会を1本のリストに統合し、`t.pool`タグで区別する
    const merged = state.guestTournaments.map(t=>({...t, pool:'guest'})).concat(state.tournaments.map(t=>({...t, pool:'auth'})));
    renderTournamentItems(tournamentList, merged);
  }

  renderList();
  // data/*.json(GitHub側=正)の取り込みが終わったら描き直す
  AtsuCup.ready.then(()=>{ renderList(); });
  // ログイン状態が変わったら(このタブ内で)描き直す
  if(typeof GoogleAuth !== 'undefined') GoogleAuth.onStateChange(()=> renderList());
})();
</script>
</body>
</html>
