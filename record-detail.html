<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>あつ杯 戦績詳細</title>
<link rel="icon" type="image/png" href="assets/icons/headings/page-home-v1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atsucup-style.css">
<link rel="stylesheet" href="guide-assistant.css">
<style>
  .hist-item-wrap{ margin-bottom:6px; }
  .hist-item-wrap .hist-item{ margin-bottom:0; }
  /* 大会名 + 使ったモンスターのチップ。375px幅では大会名の方を縮めて、
     チップ(モンスター名)が先に潰れないようにする */
  /* 大会名と、その大会で使ったモンスター。
     ⚠️ 横に並べると375px幅ではモンスター名が「ベス…」まで潰れて用をなさない。
        名前を読ませるのが目的なので縦に積み、チップに左カラムの幅を丸ごと使わせる */
  .hist-item .hist-title{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  /* テキストは自前のspanに入れる。flexの直下のテキストノードには text-overflow が効かない */
  .hist-item .hist-title .t{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist-item .hist-title .mon-chip{ max-width:100%; }
  .path-list{
    background:#eee4cf; border:1px solid var(--stone-beige); border-top:none; border-radius:0 0 8px 8px;
    padding:4px 12px 8px; margin-top:-1px;
  }
  .path-step{
    display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12px; color:var(--muted);
    border-top:1px dashed var(--line);
  }
  .path-step:first-child{ border-top:none; }
  .path-step.win{ color:var(--cream); }
  .path-step.lose{ color:var(--muted); }
  .path-round{
    flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ember2);
    background:rgba(255,106,43,.1); border-radius:5px; padding:2px 6px;
  }
  .path-mid{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .path-video{ flex-shrink:0; text-decoration:none; font-size:14px; }
</style>
</head>
<body class="page-scene page-lobby">
<a class="back-link" href="record.html" id="backToList">‹ 戦績一覧へ</a>
<div class="wrap">
  <header class="top">
    <div class="crown-mark"><img class="page-heading-icon" src="assets/icons/headings/page-records-v1.png" alt="" width="64" height="64"></div>
    <h1 id="playerNameTitle">-</h1>
    <div class="sub">PLAYER RECORD</div>
  </header>

  <section class="panel">
    <h2><span class="num">01</span> 通算成績</h2>
    <div id="filterArea"></div>
    <div id="summaryArea" style="margin-top:12px;"></div>
  </section>

  <section class="panel">
    <h2><span class="num">02</span> 愛用モンスター</h2>
    <p class="hint">エントリー時に記録されたモンスターの集計です。上の絞り込み(対象の大会・期間)がそのまま効きます。</p>
    <div id="monsterArea"></div>
  </section>

  <section class="panel">
    <h2><span class="num">03</span> 大会別の記録</h2>
    <p class="hint">大会名をタップすると、何回戦で誰と対戦したかの詳細が見られます。</p>
    <div id="entryListArea"></div>
  </section>

</div>

<script src="tap-ripple.js"></script>
<script src="gas-config.js"></script>
<script src="google-auth.js"></script>
<script src="gas-db.js"></script>
<script src="atsucup-data.js"></script>
<script src="atsucup-core.js"></script>
<script src="monster-stats-view.js"></script>
<script src="guide-assistant.js"></script>
<script>
(function(){
  "use strict";
  const escapeHtml = AtsuCup.escapeHtml;
  AtsuCup.restore();

  const qs = new URLSearchParams(location.search);
  const targetName = qs.get('name') || '';
  let expandedEntryIdx = null;

  /* ---- 集計範囲の絞り込み(record.htmlと同じ仕様。一覧から引き継いで表示する) ---- */
  const SCOPES = ['official','restricted','nonRestricted'];
  // ⚠️ 手打ちURLで壊れないよう、未知の値は捨てる。日付は形式まで見ないと、
  //    でたらめな文字列がそのまま比較に使われて「常に0件」の詰みになる
  const validDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v||'') ? v : '';
  const filter = {
    scope: SCOPES.includes(qs.get('scope')) ? qs.get('scope') : 'official',
    from: validDate(qs.get('from')),
    to: validDate(qs.get('to'))
  };
  // 一覧の並び替え・最低出場回数は個人ページでは使わないが、
  // 戻った時に一覧の見え方を復元するためそのまま持ち回る
  const passthrough = { sort: qs.get('sort') || '', min: qs.get('min') || '' };
  function filterQuery(extra){
    const p = new URLSearchParams(extra||{});
    p.set('scope', filter.scope);
    if(filter.from) p.set('from', filter.from);
    if(filter.to) p.set('to', filter.to);
    if(passthrough.sort) p.set('sort', passthrough.sort);
    if(passthrough.min) p.set('min', passthrough.min);
    return p.toString();
  }
  function syncUrl(){
    // リロードせずURLだけ更新する(戻った時に一覧側の絞り込みが保たれる)
    history.replaceState(null, '', location.pathname + '?' + filterQuery({name: targetName}));
    document.getElementById('backToList').href = 'record.html?' + filterQuery();
  }
  function hintText(){
    const count = AtsuCup.allFinishedEntries(filter).length;
    return `公式大会 ${count}件を集計中${filter.from||filter.to?`(${filter.from||'最初'} 〜 ${filter.to||'最新'})`:''}`;
  }
  /* 🔴 期間を変えた時に renderFilter() を呼び直してはいけない(record.htmlと同じ理由)。
     inputごと作り直すと、開いているネイティブの日付ピッカーが閉じてしまい、
     iOSでは2回タップしないと目的の日付を選べなくなる。件数表示だけその場で書き換える。 */
  function refreshAfterFilterChange(){
    const hint = document.getElementById('filterHint');
    if(hint) hint.textContent = hintText();
    render();
  }
  function renderFilter(){
    const btn = (key,label,cls)=>
      `<button type="button" class="flag-toggle-btn ${cls} ${filter.scope===key?'on':'off'}" data-scope="${key}">${label}</button>`;
    document.getElementById('filterArea').innerHTML = `
      <div style="margin-bottom:10px;">
        ${btn('official','🏅 全て','official')}
        ${btn('restricted','🔒 制限杯のみ','restricted')}
        ${btn('nonRestricted','🏅 制限杯をのぞく','official')}
      </div>
      <div class="date-field-row" style="margin-bottom:12px;">
        <div class="field" style="margin-bottom:0;"><label>開始日</label>
          <div class="date-input"><input type="date" id="fFrom" value="${filter.from}"><span class="date-icon">📅</span></div></div>
        <div class="field" style="margin-bottom:0;"><label>終了日</label>
          <div class="date-input"><input type="date" id="fTo" value="${filter.to}"><span class="date-icon">📅</span></div></div>
        <button class="btn btn-ghost" id="fClear" style="width:100%; margin-top:2px;">期間をクリア(全期間)</button>
      </div>
      <p class="hint" id="filterHint" style="margin:0;">${hintText()}</p>`;
    document.querySelectorAll('#filterArea [data-scope]').forEach(b=>
      b.addEventListener('click', ()=>{ filter.scope = b.dataset.scope; expandedEntryIdx=null; syncUrl(); renderAll(); }));
    document.getElementById('fFrom').addEventListener('change', e=>{ filter.from = e.target.value; expandedEntryIdx=null; syncUrl(); refreshAfterFilterChange(); });
    document.getElementById('fTo').addEventListener('change', e=>{ filter.to = e.target.value; expandedEntryIdx=null; syncUrl(); refreshAfterFilterChange(); });
    document.getElementById('fClear').addEventListener('click', ()=>{
      filter.from=''; filter.to=''; expandedEntryIdx=null;
      document.getElementById('fFrom').value=''; document.getElementById('fTo').value='';
      syncUrl(); refreshAfterFilterChange();
    });
    // ⚠️ input本体ではなくアイコンにだけ付けること(inputに付けるとネイティブの
    //    ピッカーと showPicker() が二重に走り、iOSで意図しない日付が入る)
    document.querySelectorAll('#filterArea .date-icon').forEach(ic=>{
      ic.addEventListener('click', ()=>{
        const i = ic.parentNode.querySelector('input');
        try{ i.showPicker(); }catch(e){ i.focus(); }
      });
    });
  }

  // 指定の大会(entry)で、その人が各ラウンドで誰と対戦してどうなったかを時系列で並べる
  function computeParticipantPath(entry, name){
    const path = [];
    (entry.matches||[]).forEach(round=>{
      round.forEach(m=>{
        if(m.a !== name && m.b !== name) return;
        if(m.b === null){
          path.push({ roundLabel: AtsuCup.roundLabel(round.length), opponent:null, result:'bye', video:'' });
          return;
        }
        const opponent = (m.a===name) ? m.b : m.a;
        const result = m.winner ? (m.winner===name ? 'win' : 'lose') : null;
        path.push({ roundLabel: AtsuCup.roundLabel(round.length), opponent, result, video: m.video||'' });
      });
    });
    const tp = entry.thirdPlaceMatch;
    if(tp && (tp.a===name || tp.b===name)){
      const opponent = tp.a===name ? tp.b : tp.a;
      const result = tp.winner ? (tp.winner===name ? 'win' : 'lose') : null;
      path.push({ roundLabel:'3位決定戦', opponent, result, video:'' });
    }
    return path;
  }

  function pathItemHtml(step){
    if(step.result==='bye'){
      return `<div class="path-step"><span class="path-round">${escapeHtml(step.roundLabel)}</span><span class="path-mid">🐰 不戦勝(BYE)</span></div>`;
    }
    const icon = step.result==='win' ? '⭕' : step.result==='lose' ? '❌' : '➖';
    const cls = step.result==='win' ? 'win' : step.result==='lose' ? 'lose' : '';
    return `<div class="path-step ${cls}">
      <span class="path-round">${escapeHtml(step.roundLabel)}</span>
      <span class="path-mid">${icon} vs ${step.opponent?escapeHtml(step.opponent):'(未定)'}</span>
      ${step.video?`<a class="path-video" href="${escapeHtml(step.video)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🎬</a>`:''}
    </div>`;
  }

  function render(){
    document.getElementById('playerNameTitle').textContent = targetName || '(不明)';
    const summaryArea = document.getElementById('summaryArea');
    const entryListArea = document.getElementById('entryListArea');
    const monsterArea = document.getElementById('monsterArea');

    if(!targetName){
      summaryArea.innerHTML = `<div class="empty-state" style="padding:16px 10px;">プレイヤーが指定されていません。</div>`;
      entryListArea.innerHTML = '';
      monsterArea.innerHTML = '';
      return;
    }
    const entries = AtsuCup.allFinishedEntries(filter).filter(e => (e.participants||[]).some(p=>p.name===targetName));
    if(!entries.length){
      summaryArea.innerHTML = `<div class="empty-state" style="padding:16px 10px;">この集計範囲では「${escapeHtml(targetName)}」が参加した大会がありません。<br>絞り込みを変えてみてください。</div>`;
      entryListArea.innerHTML = '';
      monsterArea.innerHTML = '';
      return;
    }

    let p1=0, p2=0, p3=0, p4=0, totalPoints=0, wins=0, games=0;
    const rows = entries.map((e,i)=>{
      const pl = AtsuCup.computePlacements(e)[targetName] || {place:null, label:'参加'};
      const pts = AtsuCup.computeTournamentPoints(e)[targetName] || 0;
      totalPoints += pts;
      if(pl.place===1) p1++; else if(pl.place===2) p2++; else if(pl.place===3) p3++; else if(pl.place===4) p4++;
      // 🔴 勝率の実戦カウントは computeTournamentPoints の「実戦勝利1P」と同じ条件にすること
      //    (entries.wins列 = countWins() は !bye を見ておらず、不戦勝シードでPと食い違う)
      const tally = (m, checkBye)=>{
        if(!(m && m.a && m.b && m.winner)) return;
        if(checkBye && m.bye) return;
        if(m.a !== targetName && m.b !== targetName) return;
        games++; if(m.winner === targetName) wins++;
      };
      (e.matches||[]).forEach(round=> round.forEach(m=> tally(m, true)));
      tally(e.thirdPlaceMatch, false); // 3位決定戦は既存実装に合わせて bye を見ない
      const me = (e.participants||[]).find(p=>p.name===targetName);
      return { idx:i, entry:e, title: e.title, label: pl.label, place: pl.place, pts,
               monsterId: (me && me.monsterId) || null };
    });

    const top4 = p1+p2+p3+p4;
    // 分母0は率が定義できない。0%にすると「まだ戦っていない」が「全敗」と同じ見え方になる
    const pct = (num, den)=> den > 0 ? (num/den*100).toFixed(1).replace(/\.0$/,'') + '%' : '—';
    summaryArea.innerHTML = `
      <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-box"><div class="v">${p1}</div><div class="l">優勝</div></div>
        <div class="stat-box"><div class="v">${p2}</div><div class="l">準優勝</div></div>
        <div class="stat-box"><div class="v">${p3}</div><div class="l">3位</div></div>
        <div class="stat-box"><div class="v">${p4}</div><div class="l">4位</div></div>
      </div>
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-box"><div class="v">${pct(wins, games)}</div><div class="l">勝率 ${wins}勝/${games}戦</div></div>
        <div class="stat-box"><div class="v">${pct(p1, entries.length)}</div><div class="l">優勝率 ${p1}/${entries.length}回</div></div>
        <div class="stat-box"><div class="v">${pct(top4, entries.length)}</div><div class="l">4強率 ${top4}/${entries.length}回</div></div>
      </div>
      <div class="stat-grid" style="grid-template-columns:1fr;">
        <div class="stat-box"><div class="v">${totalPoints}P</div><div class="l">通算ポイント</div></div>
      </div>
    `;

    renderMonsters(monsterArea, entries.length);

    const resClass = p => p===1?'p1':p===2?'p2':p===3?'p3':p===4?'p4':'pother';
    entryListArea.innerHTML = rows.map(r=>{
      const isOpen = expandedEntryIdx === r.idx;
      const path = isOpen ? computeParticipantPath(r.entry, targetName) : [];
      // 使ったモンスター。未記録(state==='none')の大会では何も出さない
      // (「—」で埋めると、記録漏れなのか記録済みなのか行を見ても分からなくなる)
      const chip = AtsuCup.monsterChip(r.monsterId);
      const chipHtml = chip.state === 'none' ? ''
        : `<span class="mon-chip is-inline ${chip.state==='known'?'has-mon':'unknown'}">${escapeHtml(chip.text)}</span>`;
      return `
      <div class="hist-item-wrap${isOpen?' is-open':''}">
        <div class="hist-item" data-entryidx="${r.idx}" style="cursor:pointer;">
          <span class="hist-title"><span class="t">${isOpen?'▾':'▸'} ${escapeHtml(r.title)}</span>${chipHtml}</span>
          <span class="row" style="gap:6px;">
            <span class="res ${resClass(r.place)}">${escapeHtml(r.label)}</span>
            <span class="count-badge muted2" style="margin:0;">${r.pts}P</span>
          </span>
        </div>
        ${isOpen ? `<div class="path-list">${path.length ? path.map(pathItemHtml).join('') : '<div class="empty-state" style="padding:8px;">対戦記録がありません。</div>'}</div>` : ''}
      </div>
    `;}).join('');

    entryListArea.querySelectorAll('.hist-item[data-entryidx]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = +el.dataset.entryidx;
        expandedEntryIdx = (expandedEntryIdx === idx) ? null : idx;
        render();
      });
    });
  }

  /* ---- 愛用モンスター ----
     🔴 集計は必ず render() と同じ filter を渡す。渡さないと上の通算成績と母数が食い違い、
        どちらが正しいのか画面からは判断できなくなる。
     ⚠️ 率の分母は「モンスターを記録した出場回数」で、出場回数そのものではない
        (未記録は集計に入らない = AtsuCup側の仕様)。母数が伝わるよう件数を必ず併記する */
  function renderMonsters(area, playedCount){
    const stats = AtsuCup.computeMonsterStatsFor(targetName, filter);
    if(!stats.length){
      area.innerHTML = `<div class="empty-state" style="padding:14px 4px;">この集計範囲では、まだモンスターの記録がありません。<br>大会詳細の「参加者とモンスター」から選ぶと、ここに集計されます。</div>`;
      return;
    }
    const total = stats.reduce((n,s)=> n+s.used, 0);
    const sorted = stats.slice().sort((a,b)=>
      b.used - a.used || String(a.name||a.id).localeCompare(String(b.name||b.id),'ja'));
    area.innerHTML = `
      <div class="count-badge" style="margin:0 0 8px;">🐾 記録のある出場: ${total} / ${playedCount}回 ・ ${stats.length}種類</div>
      ${sorted.map((s,i)=> MonsterStatsView.rowHtml(s, i+1, { total })).join('')}`;
  }

  function renderAll(){ renderFilter(); render(); }

  syncUrl();
  renderAll();
  // data/*.json(GitHub側=正)の取り込みが終わったら描き直す
  AtsuCup.ready.then(renderAll);
})();
</script>
</body>
</html>
